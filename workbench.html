<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamable</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#203b35;background:#f3f5f1;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #d5dfd8;background:white;border-radius:8px;padding:8px 13px;color:inherit}button:hover{background:#e7f1e9}button:focus-visible,a:focus-visible{outline:3px solid #5f9e84;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.primary{background:#234c3c;color:white}.danger{color:#a63333;border-color:#e7bcbc}.muted{color:#6c7f76;font-size:12px}header{height:72px;padding:14px 22px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #dde5dc;background:#fff}h1{font-size:18px;margin:0}header .right{margin-left:auto;display:flex;align-items:center;gap:10px}.shell{display:grid;grid-template-columns:minmax(380px,43%) 1fr;gap:12px;padding:12px;height:calc(100vh - 72px)}.panel{border:1px solid #dce3d9;border-radius:12px;background:white;overflow:hidden;display:flex;flex-direction:column;min-width:0}.panelbar{min-height:45px;padding:9px 13px;border-bottom:1px solid #e7ece5;display:flex;align-items:center;gap:8px}.panelbar strong{font-size:13px}.panelbar a{margin-left:auto;color:#577b69;font-size:12px}.chat{width:100%;border:0;flex:1;min-height:0}nav{display:flex;gap:4px;padding:7px;background:#fafbf9;border-bottom:1px solid #e4e9e1}nav button{border-color:transparent;background:transparent}nav button[aria-selected=true]{background:#e5efe2;font-weight:600}.content{flex:1;min-height:0;overflow:auto}.view{display:none;height:100%}.view.active{display:block}#previewView{background:#ecefe9;padding:12px}.previewbar{display:flex;align-items:center;gap:7px;margin-bottom:10px}.previewbar span{margin-left:auto}#preview{width:100%;height:calc(100% - 48px);border:1px solid #dae1d7;border-radius:8px;background:white;display:block;margin:auto;transition:width .2s}.pad{padding:18px}pre{font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;background:#f6f8f4;padding:14px;border-radius:8px;color:#324c3f}select{padding:8px;max-width:100%;border:1px solid #d4dfd4;border-radius:6px}.run{padding:12px 0;border-bottom:1px solid #e4eae1}.run p{margin:4px 0;line-height:1.5}.metric{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:#677c6e}.status{padding:10px 14px;border-top:1px solid #e1e8dd;display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:7px;height:7px;background:#81a873;border-radius:50%}.notice{border:1px solid #e6cf91;background:#fff8e7;border-radius:8px;margin:10px 12px;padding:12px;line-height:1.6}#questions:empty,#selection:empty{display:none}#selection{font-size:12px;background:#eff5e9}.notice button{margin:7px 5px 0 0}.question{margin:5px 0 9px}.question p{margin:3px 0}#toast{position:fixed;bottom:20px;left:20px;background:#243c30;color:white;padding:10px 16px;border-radius:8px;display:none;z-index:20}@media(max-width:900px){.shell{grid-template-columns:1fr;height:auto}.panel{min-height:600px}.content{min-height:500px}header{height:auto;flex-wrap:wrap}header .right{margin-left:0}.chat{min-height:500px}}
#annotationHelp{margin:0 0 10px;padding:9px 12px;background:#eff5e9;border-radius:8px;line-height:1.5;font-size:12px}#previewView{display:none;flex-direction:column}#previewView.active{display:flex}#preview{flex:1;min-height:0;height:auto}.previewbar{flex-wrap:wrap}#annotate[aria-pressed=true]{background:#234c3c;color:white}</style></head><body>
<header><h1>Dreamable</h1><div class="right"><button id="stop" class="danger" disabled>停止任务</button></div></header>
<main class="shell"><section class="panel"><div class="panelbar"><strong>与开发助手对话</strong><button id="historyStart" style="margin-left:auto;padding:4px 8px">回到最早对话</button></div><iframe id="chat" class="chat" title="与开发助手对话"></iframe><div id="steering" class="notice" hidden aria-live="polite"></div><div id="questions" class="notice"></div><div id="selection" class="notice"></div></section>
<section class="panel"><nav role="tablist" aria-label="项目结果"><button role="tab" aria-selected="true" data-view="previewView">应用预览</button><button role="tab" aria-selected="false" data-view="filesView">代码</button><button role="tab" aria-selected="false" data-view="runsView">版本与记录</button></nav><div class="pad" style="padding:10px 13px;border-bottom:1px solid #e4e9e1"><div id="workspaceState" class="muted" aria-live="polite">正在读取工作区状态…</div><div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap"><button id="connectWorkspace" hidden>连接火山沙箱</button><button id="pauseWorkspace" hidden>暂停沙箱</button><button id="exportSource">导出当前源码与 Git 历史</button></div></div><div class="content">
<div id="previewView" class="view active"><div class="previewbar"><button id="refresh">刷新预览</button><button id="mobile">手机尺寸</button><button id="annotate" aria-pressed="false" aria-describedby="annotationHelp" disabled hidden>批注</button><a id="openPreview" target="_blank" rel="noopener noreferrer" hidden>单独打开应用</a><button id="copyPreview" hidden>复制预览地址</button></div><p id="annotationHelp" role="status" hidden></p><iframe id="preview" title="Agent 生成的应用" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe></div>
<div id="filesView" class="view pad"><label for="fileList">工作区文件 </label><select id="fileList"></select><pre id="fileText">暂无文件</pre></div>
<div id="runsView" class="view pad"><div id="gitSync"><p id="gitState">远端保存尚未启用</p><a id="gitHistory" target="_blank" rel="noreferrer" hidden>查看仓库与提交历史</a> <button id="syncGit">保存 / 重试同步</button></div><div id="runs"></div><details><summary>服务器保存的对话</summary><pre id="transcript"></pre></details></div>

</div><div class="status"><span class="dot"></span><strong id="status">正在连接</strong><span id="statDetail" class="muted"></span></div></section></main>
<div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);let lastVersion='',lastQuestion='',fileNames='',latest=null,mobile=false,annotating=false,previewUrl='',previewOrigin='',workspaceBusy=false;
$('chat').src='/dreamable-pydantic-next-m1?agui=1';
window.spikeNotice=message=>toast(message);
$('historyStart').onclick=()=>{const doc=$('chat').contentDocument;const scroller=doc?.querySelector('[data-radix-scroll-area-viewport]')||[...(doc?.querySelectorAll('*')||[])].find(el=>el.scrollHeight>el.clientHeight+100&&getComputedStyle(el).overflowY==='auto');if(scroller)scroller.scrollTop=0;else toast('历史正在加载，请稍后再试')};
const labels={running:'执行中',cancelling:'正在停止',cancelled:'已停止',completed:'已完成',waiting:'等待你的回答',failed:'执行失败',interrupted:'进程已中断'};
function toast(text){$('toast').textContent=text;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',5000)}
async function post(url,data={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
function draft(text,append=false){const setDraft=$('chat').contentWindow.spikeDraft;if(!setDraft){toast('聊天界面正在加载，请稍后再试');return}setDraft(text,append);toast('上下文已放入输入框，确认后发送')}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===button.dataset.view));if(button.dataset.view==='filesView')loadFile();if(button.dataset.view==='runsView')loadTranscript()});
$('stop').onclick=async()=>{const stop=$('chat').contentWindow.spikeStop;if(!stop){toast('聊天界面正在加载，请稍后重试');return}await stop();await poll()};
function showPreview(url,version=''){
 $('openPreview').hidden=$('copyPreview').hidden=!url;
 if(!url){previewUrl=previewOrigin='';$('preview').src='about:blank';$('annotate').disabled=true;return}
 const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw Error('预览地址无效');
 $('openPreview').href=url;
 previewUrl=url;previewOrigin=parsed.origin;parsed.searchParams.set('v',version||Date.now());$('preview').src=parsed.href;
}
$('copyPreview').onclick=async()=>{try{await navigator.clipboard.writeText(previewUrl);toast('已复制应用预览地址')}catch{toast('复制失败；右键“单独打开应用”复制链接地址')}};
async function connectWorkspace(){if(workspaceBusy)return;workspaceBusy=true;try{const result=await post('/spike/preview');showPreview(result.preview);await poll();toast('工作区、Git 和预览已就绪')}catch(e){toast(e.message)}finally{workspaceBusy=false;await poll()}}
$('refresh').onclick=connectWorkspace;
$('connectWorkspace').onclick=connectWorkspace;
$('pauseWorkspace').onclick=async()=>{if(workspaceBusy)return;workspaceBusy=true;try{const result=await post('/spike/workspace/pause');showPreview(null);toast(result.workspace.phase==='paused'?'已确认沙箱暂停':'当前没有已创建的沙箱')}catch(e){toast(e.message)}finally{workspaceBusy=false;await poll()}};
$('exportSource').onclick=async()=>{if(workspaceBusy)return;workspaceBusy=true;try{const result=await post('/spike/source-export');const link=document.createElement('a');link.href=result.download;link.download='';link.click();toast('源码与 Git 历史已导出，版本 '+result.code_version.slice(0,12))}catch(e){toast(e.message)}finally{workspaceBusy=false;await poll()}};

$('syncGit').onclick=async()=>{if(workspaceBusy)return;workspaceBusy=true;try{const result=await post('/spike/git-sync');toast(result.git_sync.remote_saved?'远端版本已确认保存':'源码已提交，但远端保存未确认；请查看保存状态')}catch(e){toast(e.message)}finally{workspaceBusy=false;await poll()}};
function renderGit(){const g=latest.git_sync||{status:'disabled'};const confirmed=g.remote_saved===true;$('gitState').textContent=g.status==='disabled'?'远端保存尚未启用':confirmed?'已保存到 GitHub · '+g.branch+' · '+g.remote_head.slice(0,12):'远端未确认 · '+(g.local_head?.slice(0,12)||'—')+(g.error_type?' · '+g.error_type:'');$('gitHistory').hidden=!g.url;if(g.url)$('gitHistory').href=g.url;$('syncGit').disabled=workspaceBusy||latest.workspace.busy||!!(latest.active&&!latest.active.done)||g.status==='disabled';}
$('mobile').onclick=()=>{mobile=!mobile;$('preview').style.width=mobile?'min(390px,100%)':'100%';$('mobile').textContent=mobile?'桌面尺寸':'手机尺寸'};
function annotationMode(enabled,notify=true){annotating=enabled;$('annotate').setAttribute('aria-pressed',String(enabled));$('annotate').textContent=enabled?'退出批注':'批注';$('annotationHelp').hidden=!enabled;$('annotationHelp').textContent=enabled?'点击页面内容以选中，按 Esc 退出批注。':'';if(notify&&previewOrigin)$('preview').contentWindow.postMessage({type:'spike-annotation-mode',enabled},previewOrigin)}
$('annotate').onclick=()=>annotationMode(!annotating);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&annotating)annotationMode(false)});
$('preview').addEventListener('load',()=>{annotationMode(false);$('selection').replaceChildren()});
$('fileList').onchange=loadFile;
async function loadFile(){const name=$('fileList').value;if(!name)return;const r=await fetch('/spike/file?name='+encodeURIComponent(name));$('fileText').textContent=(await r.json()).text}
async function loadTranscript(){const r=await fetch('/spike/transcript');const ms=await r.json();$('transcript').textContent=ms.map(m=>m.role.toUpperCase()+'\n'+(typeof m.content==='string'?m.content:(m.content||[]).filter(p=>p.type==='text').map(p=>p.text).join('\n'))).filter(s=>s.trim().includes('\n')).join('\n\n')||'尚无消息'}
function renderRuns(runs){$('runs').replaceChildren();[...runs].reverse().forEach(run=>{const el=document.createElement('div');el.className='run';const title=document.createElement('strong');title.textContent=(run.status==='waiting'?'本轮已提出追问':labels[run.status]||run.status)+' · '+new Date(run.started*1000).toLocaleTimeString();const p=document.createElement('p');p.textContent=run.prompt;const metrics=document.createElement('div');metrics.className='metric';metrics.textContent=`用时 ${run.seconds??Math.round(Date.now()/1000-run.started)}s · 首次动作 ${run.first_event_seconds??'—'}s · 模型请求 ${run.usage?.requests??'—'} · 已回传 Token ${run.usage?run.usage.input_tokens+run.usage.output_tokens:'—'}${run.status==='cancelled'?'（中断，可能不完整）':''}${run.stop_seconds!=null?' · 停止 '+run.stop_seconds+'s':''} · 改动 ${(run.changed_files||[]).filter(n=>!n.startsWith('.')).length} 个文件`;el.append(title,p,metrics);if(run.code_version){const c=document.createElement('p');c.className='muted';c.textContent='沙箱 Git 版本：'+run.code_version.slice(0,12);if(latest.git_sync?.repo){const a=document.createElement('a');a.href='https://github.com/'+latest.git_sync.repo+'/commit/'+run.code_version;a.target='_blank';a.rel='noreferrer';a.textContent=' 查看提交';c.append(a)}el.append(c)}if(run.save_error){const e=document.createElement('p');e.textContent='源码版本保存未完成；请先恢复工作区再导出。';el.append(e)}if(run.error){const e=document.createElement('p');e.textContent='原因：'+(run.error_reason||run.error);el.append(e)}if(run.done){const btn=document.createElement('button');btn.textContent='查看改动';btn.style.marginTop='8px';btn.onclick=async()=>{const r=await fetch('/spike/changes/'+run.id);const pre=document.createElement('pre');pre.textContent=(await r.json()).text||'本轮没有文件改动';btn.replaceWith(pre)};el.append(btn)}$('runs').append(el)})}
function renderWorkspace(){
 const w=latest.workspace,cloud=w.provider==='e2b',busy=workspaceBusy||w.busy||!!(latest.active&&!latest.active.done);
 $('connectWorkspace').hidden=!cloud;$('pauseWorkspace').hidden=!cloud;
 $('connectWorkspace').textContent=w.sandbox_id?'恢复 / 重连沙箱':'连接火山沙箱';
 $('connectWorkspace').disabled=busy||!w.configured;$('pauseWorkspace').disabled=busy||!w.configured||!w.sandbox_id;
 $('exportSource').disabled=busy||(cloud&&!w.ready);$('refresh').disabled=busy||(cloud&&!w.configured);
 const phases={disconnected:'未连接',connecting:'连接中',provisioning:'准备工作区', 'starting-preview':'正在启动预览',ready:'已连接',paused:'已暂停',error:'接入失败',stopped:'已停止'};
 $('workspaceState').textContent=(w.maintenance?'维护中，暂不接收新任务 · ':'')+(cloud?'火山 E2B':'本地 Docker')+' · '+(phases[w.phase]||w.phase)+(w.missing.length?' · 缺少 '+w.missing.join('、'):'')+(w.error?' · '+w.error:'');
 if(latest.preview&&latest.preview!==previewUrl)showPreview(latest.preview);
 if(!latest.preview&&previewUrl)showPreview(null);
}
function renderQuestions(pending){$('questions').replaceChildren();if(Object.keys(pending).length)$('questions').textContent='等待你的选择：点击对话中的选项卡片即可提交，也可以在输入框回答。'}
async function poll(){try{const r=await fetch('/spike/status');latest=await r.json();renderWorkspace();renderGit();const run=latest.active||latest.runs.at(-1);$('status').textContent=run?(labels[run.status]||run.status):(latest.workspace.provider==='e2b'&&!latest.workspace.ready?'等待沙箱连接':'准备就绪');$('statDetail').textContent=` · ${latest.files.length} 个文件`;const receipts=run?.steering||[];$('steering').hidden=!receipts.length;$('steering').replaceChildren(...receipts.map(item=>{const row=document.createElement('div');row.textContent=({'queued':'已收到，等待本步完成','delivered':'已送入模型，查看回复确认结果','not_delivered':'已留存，但未执行；请重新发送'}[item.status]||item.status)+'：'+item.text;return row}));$('chat').contentWindow.spikeSetTaskState?.(latest);$('stop').disabled=run?.status==='cancelling'||((!latest.active||latest.active.done)&&!Object.keys(latest.pending).length);if(latest.files.join()!==fileNames){fileNames=latest.files.join();const old=$('fileList').value;$('fileList').replaceChildren(...latest.files.map(n=>new Option(n,n)));if(latest.files.includes(old))$('fileList').value=old}try{const path=$('chat').contentWindow.location.pathname;if(/^\/[a-zA-Z0-9_-]+$/.test(path))localStorage.setItem('dreamable-spike-chat-path',path)}catch{}const visiblePending=latest.active&&!latest.active.done?{}:latest.pending;const q=JSON.stringify(visiblePending);if(q!==lastQuestion){lastQuestion=q;renderQuestions(visiblePending)}if(run?.done&&run.id!==lastVersion){lastVersion=run.id;$('chat').contentWindow.spikeSync?.();renderRuns(latest.runs)}else if(run&&!run.done)renderRuns(latest.runs)}catch(e){$('status').textContent='连接已断开；服务恢复后自动重连'}}
window.addEventListener('message',e=>{
 if(!previewOrigin||e.origin!==previewOrigin||e.source!==$('preview').contentWindow||!e.data)return;
 const d=e.data;
 if(d.type==='spike-annotation-ready'){$('annotate').disabled=false;annotationMode(false);return}
 if(d.type==='spike-annotation-mode'&&typeof d.enabled==='boolean'){annotationMode(d.enabled,false);return}
 if(d.type!=='spike-selection'||typeof d.text!=='string'||typeof d.selector!=='string'||typeof d.path!=='string')return;
 const context=`【页面上下文】项目 Dreamable；版本参考 ${lastVersion||'当前工作区'}（预览可能含未完成改动）；路径 ${d.path.slice(0,500)}；元素 ${d.selector.slice(0,2000)}；文字 ${d.text.slice(0,500)}\n我的问题或修改：`;
 $('selection').replaceChildren();const p=document.createElement('div');p.textContent='已选中：'+d.text.slice(0,80);
 const note=document.createElement('div');note.textContent='点“带入会话”，再在输入框描述你的问题或修改要求；点击发送才会交给助手。';
 const b=document.createElement('button');b.textContent='带入会话';b.onclick=()=>{draft(context,true);b.disabled=true;b.textContent='已带入，请在输入框补充并发送'};
 const clear=document.createElement('button');clear.textContent='清除选择';clear.onclick=()=>$('selection').replaceChildren();$('selection').append(p,note,b,clear);
});
function openLinkedCode(){if(location.hash!=='#code'||!latest)return;if([...$('fileList').options].some(o=>o.value==='app/page.jsx'))$('fileList').value='app/page.jsx';document.querySelector('[data-view="filesView"]').click()}
window.addEventListener('hashchange',openLinkedCode);
poll().then(openLinkedCode);setInterval(poll,1200);
</script></body></html>
